<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秒杀实验室 · Go</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#172a30;background:#f3f5f2}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:44px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.tag{color:#14715a;font:700 12px monospace;letter-spacing:2px}h1{font-size:38px;margin:12px 0}p{color:#60706e;line-height:1.8}button{cursor:pointer;background:#16634f;color:white;border:0;padding:12px 18px;border-radius:8px;font-weight:600}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e7eee9;color:#205641}.layout{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}.panel,.product{background:white;border:1px solid #dce4dc;border-radius:14px;padding:24px}.product{margin-bottom:16px}h2{font-size:19px;margin:0 0 18px}h3{margin:0 0 10px;font-size:18px}.price{font-size:28px;color:#17694e;margin:20px 0}.stock{float:right;font-size:14px;color:#53665b}.track{height:5px;background:#e8eee8;border-radius:4px;margin:18px 0}.fill{height:100%;background:#70a488;border-radius:4px}label{display:block;font-size:13px;margin:18px 0 8px}input,textarea{font:inherit;width:100%;border:1px solid #d6dfd7;border-radius:7px;padding:10px;resize:vertical}textarea{font-size:12px}pre{white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.7;background:#f4f6f2;padding:14px;max-height:340px;overflow:auto}small{color:#65756b}.row{display:flex;gap:10px;align-items:center}.row input{width:100px}footer{margin-top:30px;font-size:13px;color:#617064}@media(max-width:750px){.layout{grid-template-columns:1fr}h1{font-size:28px}header{align-items:flex-start}}
</style></head><body><main>
<header><div><div class="tag">GO / SECKILL LAB</div><h1>把最后一件，卖得正确。</h1><p>每场限购一件。重复提交同一请求，会返回同一张订单。</p></div><button class="secondary" id="refresh">刷新库存</button></header>
<div class="layout"><section id="products" aria-live="polite">加载商品中…</section><section class="panel"><h2>抢购操作台</h2><small id="mode">读取运行模式…</small>
<div id="demo" hidden><label for="user">演示用户编号</label><div class="row"><input id="user" type="number" value="1" min="1" max="1000000"><button id="login">切换用户</button></div></div>
<label for="token">访问令牌</label><textarea id="token" rows="3" placeholder="MySQL 模式：粘贴 cmd/token 生成的令牌"></textarea>
<label for="key">本次请求编号 · 网络失败时请保留</label><input id="key" readonly><p><small>点击商品按钮提交。重试原商品将沿用编号；换商品会生成新编号。</small></p>
<div class="row"><input id="orderID" type="number" min="1" placeholder="订单 ID"><button class="secondary" id="query">查询我的订单</button></div>
<label>请求结果</label><pre id="result" aria-live="polite">等待你的第一次抢购。</pre></section></div>
<footer>内存模式重启恢复演示库存 · MySQL 模式持久保存订单 · 本项目不包含支付、退款和真实登录</footer>
</main><script>
const $=id=>document.getElementById(id);let currentProduct=0,busy=false;
function newKey(){ $('key').value=crypto.randomUUID(); }
function show(value){$('result').textContent=typeof value==='string'?value:JSON.stringify(value,null,2)}
async function api(path,options={}){const response=await fetch(path,options);const data=await response.json();return {status:response.status,data};}
async function refresh(){try{const {status,data}=await api('/api/products');if(status!==200)throw Error(data.message);$('products').replaceChildren();for(const p of data){const card=document.createElement('article');card.className='product';const h=document.createElement('h3');h.textContent=p.name;const meta=document.createElement('small');meta.textContent='场次 #'+p.id+' · 每人限购 1 件';const price=document.createElement('div');price.className='price';price.textContent='¥'+(p.price_cents/100).toFixed(2);const stock=document.createElement('span');stock.className='stock';stock.textContent='剩余 '+p.stock+' / '+p.initial_stock;price.append(stock);const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=(p.initial_stock?100*p.stock/p.initial_stock:0)+'%';track.append(fill);const time=document.createElement('p');time.textContent='截止 '+new Date(p.ends_at).toLocaleString();const button=document.createElement('button');button.textContent='立即抢购 / 重试';button.disabled=busy;button.onclick=()=>buy(p.id);card.append(h,meta,price,track,time,button);$('products').append(card);}}catch(e){show('加载失败：'+e.message)}}
async function login(){try{const res=await api('/api/demo/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:Number($('user').value)})});if(res.status!==200)throw Error(res.data.message);$('token').value=res.data.token;currentProduct=0;newKey();show('已切换用户 '+$('user').value);}catch(e){show(e.message)}}
async function buy(id){if(busy)return;if(!$('token').value.trim()){show('请先获取或粘贴访问令牌。');return}if(currentProduct!==id){currentProduct=id;newKey()}busy=true;document.querySelectorAll('#products button').forEach(b=>b.disabled=true);try{const res=await api('/api/orders',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('token').value.trim(),'Idempotency-Key':$('key').value},body:JSON.stringify({product_id:id})});show(res);if(res.data.order)$('orderID').value=res.data.order.id;}catch(e){show('连接失败，请保留请求编号并重试：'+e.message)}finally{busy=false;await refresh()}}
$('refresh').onclick=refresh;$('login').onclick=login;$('query').onclick=async()=>{try{show(await api('/api/orders/'+encodeURIComponent($('orderID').value),{headers:{'Authorization':'Bearer '+$('token').value.trim()}}))}catch(e){show(e.message)}};
(async()=>{newKey();await refresh();try{const {data}=await api('/api/config');$('demo').hidden=!data.demo_auth;$('mode').textContent=data.demo_auth?'本地内存演示 · 可切换测试用户':'MySQL 持久化 · 使用服务端签发的令牌';if(data.demo_auth)await login()}catch(e){show(e.message)}})();
</script></body></html>
