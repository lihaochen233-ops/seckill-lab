name: pulse-mall
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  environment: &environment
    MALL_MODE: stack
    MALL_ADDR: 0.0.0.0:8088
    MYSQL_DSN: "pulse:${MYSQL_PASSWORD:?Run scripts/setup.ps1 first}@tcp(mysql:3306)/pulse?charset=utf8mb4&parseTime=true"
    REDIS_ADDR: redis:6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Required}
    AMQP_URL: "amqp://pulse:${RABBIT_PASSWORD:?Required}@rabbitmq:5672/"
    APP_ORIGINS: ${APP_ORIGINS:-http://127.0.0.1:8088,http://localhost:8088}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ORDER_TTL: ${ORDER_TTL:-15m}
  networks: [backend]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped
  stop_grace_period: 25s
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
      MYSQL_DATABASE: pulse
      MYSQL_USER: pulse
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Required}
    command:
      [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci]
    volumes: [mysql-data:/var/lib/mysql]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD-SHELL,
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 --silent',
        ]
      interval: 5s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Required}
    command:
      [
        sh,
        -c,
        'exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes: [redis-data:/data]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    hostname: pulse-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: pulse
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Required}
    volumes: [rabbit-data:/var/lib/rabbitmq]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 40
  init:
    <<: *app
    command: [-init]
    environment:
      <<: *environment
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pulse.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Required}
    restart: "no"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
  api:
    <<: *app
    command: [-role, api]
    ports: ["127.0.0.1:8088:8088"]
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8088/api/health]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    command: [-role, worker]
    depends_on:
      init: { condition: service_completed_successfully }
  bench:
    <<: *app
    profiles: [tools]
    entrypoint: [/app/mallbench]
    restart: "no"
    depends_on:
      api: { condition: service_healthy }
      worker: { condition: service_started }

networks:
  backend:
    internal: true
volumes:
  mysql-data:
  redis-data:
  rabbit-data:
